apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
  labels:
    app: frontend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend-container
          image: ekadiyski/kubernetes-eventforge-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://springboot-backend:8081"
            - name: DIGITAL_OCEAN_ACCESS_KEY
              value: "asdf"
            - name: DIGITAL_OCEAN_SECRET_KEY
              value: "asdf"
            - name: DIGITAL_OCEAN_BUCKET_NAME
              value: "asdf"
            - name: SPACE_BUCKET_ORIGIN_URL
              value: "asdf"
            - name: PORT
              value: "8080"
            - name: WEBHOOK_URL
              value: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"